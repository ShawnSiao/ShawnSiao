    <g fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5"><path d="M0 250H130L170 210H315"/><path d="M80 320V285L125 240"/><path d="M440 0V45L480 85H640"/><path d="M690 320V275L730 235H815"/><path d="M1170 30V75L1130 115"/></g>
    <g fill="#67e8f9" filter="url(#glow)"><circle cx="130" cy="250" r="3"/><circle cx="170" cy="210" r="3"/><circle cx="480" cy="85" r="3"/><circle cx="730" cy="235" r="3"/></g>
    <g transform="translate(58 48)"><rect width="420" height="34" rx="17" fill="#0f2742" stroke="#38bdf8" stroke-opacity="0.35"/><circle cx="18" cy="17" r="4" fill="#fb7185"/><circle cx="34" cy="17" r="4" fill="#fbbf24"/><circle cx="50" cy="17" r="4" fill="#34d399"/><text x="70" y="22" fill="#93c5fd" font-family="Consolas,Monaco,monospace" font-size="14">shawn@local-first:~$ build --with-evidence</text></g>
