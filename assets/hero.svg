    <text x="61" y="183" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" letter-spacing="3">LOCAL-FIRST AI PRODUCT BUILDER</text>
    <text x="61" y="218" fill="#a8b8d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Windows products · agent workflows · open-source engineering</text>
