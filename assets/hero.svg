    <g transform="translate(958 151)"><circle r="108" fill="none" stroke="#38bdf8" stroke-opacity="0.18"/><circle r="78" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-dasharray="8 8"/><circle r="45" fill="#0b2441" stroke="url(#accent)" stroke-width="2"/><path d="M0-45 39-22 39 22 0 45-39 22-39-22Z" fill="none" stroke="#67e8f9" stroke-opacity="0.65"/><text x="0" y="9" text-anchor="middle" fill="#e0f2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">AI</text><g fill="#67e8f9" filter="url(#glow)"><circle cx="0" cy="-108" r="4"/><circle cx="94" cy="-53" r="4"/><circle cx="94" cy="53" r="4"/><circle cx="0" cy="108" r="4"/><circle cx="-94" cy="53" r="4"/><circle cx="-94" cy="-53" r="4"/></g><g stroke="#67e8f9" stroke-opacity="0.32"><path d="M0-108V-45M94-53 39-22M94 53 39 22M0 108V45M-94 53-39 22M-94-53-39-22"/></g></g>
    <text x="1160" y="294" text-anchor="end" fill="#64748b" font-family="Consolas,Monaco,monospace" font-size="12" letter-spacing="1.5">OPEN SOURCE / SECURITY / RELIABILITY</text>
