      <g transform="translate(90)"><rect width="118" height="28" rx="6" fill="#111f33" stroke="#60a5fa" stroke-opacity="0.55"/><text x="15" y="19" fill="#93c5fd">TYPESCRIPT</text></g>
      <g transform="translate(220)"><rect width="88" height="28" rx="6" fill="#111f33" stroke="#818cf8" stroke-opacity="0.55"/><text x="17" y="19" fill="#a5b4fc">PYTHON</text></g>
