<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VoiceVault local evidence system</title>
  <desc id="desc">A local-first pipeline from public sources to cited answers, with person-scoped archives, local retrieval, evidence, and uncertainty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1825"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#274158" stroke-opacity=".22"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="900" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="898" rx="27" fill="none" stroke="#36516a"/>

  <g transform="translate(76 68)">
    <rect width="54" height="54" rx="14" fill="#102b2d" stroke="#45d6b1"/>
    <path d="M17 17h20v20H17zM22 22h10v10H22z" fill="none" stroke="#6ee7b7" stroke-width="3"/>
    <text x="72" y="22" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="24" font-weight="700">VOICEVAULT</text>
    <text x="72" y="48" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">LOCAL EVIDENCE SYSTEM // PERSON-SCOPED</text>
  </g>

  <g transform="translate(76 190)">
    <text fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="760">Public content in.</text>
    <text y="72" fill="url(#accent)" font-family="Arial, sans-serif" font-size="58" font-weight="760">Cited answers out.</text>
    <text y="126" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">An attributable archive and evidence-grounded Q&amp;A workspace that stays on the operator's machine.</text>
  </g>

  <g transform="translate(76 408)">
    <path d="M248 85h78M574 85h78M900 85h78" stroke="#4c7185" stroke-width="2" stroke-dasharray="8 8"/>
    <g>
      <rect width="248" height="170" rx="18" fill="#101f2d" stroke="#2b4b61"/>
      <circle cx="34" cy="34" r="8" fill="#38bdf8" filter="url(#glow)"/>
      <text x="28" y="82" fill="#7dd3fc" font-family="ui-monospace, Consolas, monospace" font-size="14">01 // INGEST</text>
      <text x="28" y="116" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="23" font-weight="700">PUBLIC SOURCES</text>
      <text x="28" y="145" fill="#8ca2b5" font-family="Arial, sans-serif" font-size="16">posts · revisions · URLs</text>
    </g>
    <g transform="translate(326)">
      <rect width="248" height="170" rx="18" fill="#10232b" stroke="#2c635f"/>
      <circle cx="34" cy="34" r="8" fill="#6ee7b7" filter="url(#glow)"/>
      <text x="28" y="82" fill="#6ee7b7" font-family="ui-monospace, Consolas, monospace" font-size="14">02 // ATTRIBUTE</text>
      <text x="28" y="116" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="23" font-weight="700">PERSON ARCHIVE</text>
      <text x="28" y="145" fill="#8ca2b5" font-family="Arial, sans-serif" font-size="16">accounts · timestamps · evidence</text>
    </g>
    <g transform="translate(652)">
      <rect width="248" height="170" rx="18" fill="#101f2d" stroke="#2b4b61"/>
      <circle cx="34" cy="34" r="8" fill="#38bdf8" filter="url(#glow)"/>
      <text x="28" y="82" fill="#7dd3fc" font-family="ui-monospace, Consolas, monospace" font-size="14">03 // RETRIEVE</text>
      <text x="28" y="116" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="23" font-weight="700">LOCAL INDEX</text>
      <text x="28" y="145" fill="#8ca2b5" font-family="Arial, sans-serif" font-size="16">full text · optional vectors</text>
    </g>
    <g transform="translate(978)">
      <rect width="248" height="170" rx="18" fill="#10232b" stroke="#2c635f"/>
      <circle cx="34" cy="34" r="8" fill="#6ee7b7" filter="url(#glow)"/>
      <text x="28" y="82" fill="#6ee7b7" font-family="ui-monospace, Consolas, monospace" font-size="14">04 // ANSWER</text>
      <text x="28" y="116" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="23" font-weight="700">CITED OUTPUT</text>
      <text x="28" y="145" fill="#8ca2b5" font-family="Arial, sans-serif" font-size="16">citations · evidence · uncertainty</text>
    </g>
  </g>

  <g transform="translate(76 662)">
    <rect width="1288" height="134" rx="18" fill="#0a151f" stroke="#263c4d"/>
    <text x="28" y="38" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="14">SYSTEM PROPERTIES</text>
    <g transform="translate(28 62)" font-family="ui-monospace, Consolas, monospace" font-size="16">
      <rect width="190" height="40" rx="20" fill="#112b28" stroke="#2e6b5e"/><text x="20" y="26" fill="#86efac">● LOCAL RUNTIME</text>
      <rect x="210" width="230" height="40" rx="20" fill="#102534" stroke="#2d5872"/><text x="230" y="26" fill="#7dd3fc">● REVIEWABLE EVIDENCE</text>
      <rect x="460" width="218" height="40" rx="20" fill="#102534" stroke="#2d5872"/><text x="480" y="26" fill="#7dd3fc">● EXPLICIT BOUNDARIES</text>
      <rect x="698" width="190" height="40" rx="20" fill="#112b28" stroke="#2e6b5e"/><text x="718" y="26" fill="#86efac">PYTHON 3.11+</text>
      <rect x="908" width="152" height="40" rx="20" fill="#112b28" stroke="#2e6b5e"/><text x="928" y="26" fill="#86efac">SQLITE · FTS</text>
    </g>
  </g>

  <text x="1364" y="848" text-anchor="end" fill="#40596d" font-family="ui-monospace, Consolas, monospace" font-size="13">VOICEVAULT / ARCHITECTURE VIEW</text>
</svg>
